name = "hearth"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Host our Solid.js frontend directly!
[assets]
directory = "../web/dist"
binding = "ASSETS"

# Durable Object binding for real-time chat channels
[durable_objects]
bindings = [
  { name = "CHANNELS", class_name = "ChannelDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelDO"]