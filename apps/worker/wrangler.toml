name = "hearth-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Durable Object binding for real-time chat channels
[durable_objects]
bindings = [
  { name = "CHANNELS", class_name = "ChannelDO" }
]

# Durable Objects migration (uses built-in SQLite storage)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelDO"]